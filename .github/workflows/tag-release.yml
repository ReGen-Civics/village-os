# Tag a release without a person at a terminal.
#
# A release is cut by a pull request that moves the version (package.json,
# PLATFORM_VERSION, docker-compose.yml, START_HERE.md) and CHANGELOG.md, merged
# to main. The annotated tag vX.Y.Z then starts release.yml. The release train
# (release-train-land.yml) pushes that tag on its own, but only while the train
# is switched on; with the train paused the tag was a person running
# `git push origin vX.Y.Z`, because the coordinator's git cannot push tags.
# It can dispatch a workflow, so this is that workflow.
#
# Dispatch it from main with the version, and optionally the commit:
#
#   gh workflow run tag-release.yml -f version=1.3.21 [-f sha=<commit>]
#
# THE GUARDS (scripts/tag-release-check.mjs, held by server/tagRelease.test.ts),
# all checked before anything is written, every refusal named:
#   - the version is a plain X.Y.Z;
#   - the commit is on main (main's tip when no sha is given);
#   - at that commit, package.json, PLATFORM_VERSION, a `## X.Y.Z` section in
#     CHANGELOG.md and docker-compose.yml's default image all name the version;
#   - no tag vX.Y.Z exists yet;
#   - ci concluded success on a push run at exactly that commit, OR the
#     commit is a merge whose tree equals its second parent's, and that parent
#     passed a ci push run with every job present and green (the tested twin).
#
# THEN release.yml HAS TO RUN, and it decides whether anything publishes. It
# asks ci again, runs the rollback check, builds, boots, and only then pushes.
# Nothing here skips any of that. A tag pushed with the built-in GITHUB_TOKEN
# starts no other workflow, so:
#   - with the secret RELEASE_BOT_TOKEN set, the tag is pushed with it and
#     release.yml starts on its own tag-push trigger;
#   - without it, the tag is pushed with GITHUB_TOKEN and the second job
#     dispatches release.yml on the tag (a dispatch made with GITHUB_TOKEN does
#     start a run). release.yml treats that dispatch exactly like a tag push.

name: tag-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to tag, without the v (for example 1.3.21)"
        required: true
        type: string
      sha:
        description: "The commit to tag. Empty means main's tip."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One tagging of one version at a time. Never cancelled: a tag half-pushed is
# worse than a second run that finds the tag already there and stops.
concurrency:
  group: tag-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To push the tag.
      contents: write
      # To read ci's runs on the commit.
      actions: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      dispatch: ${{ steps.push.outputs.dispatch }}
    steps:
      - name: Dispatched from main
        # The guards that run are the ones in the dispatched ref. Only main's
        # are the reviewed ones.
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch tag-release.yml from main (it was dispatched from ${REF}). The commit to tag is the sha input, not the ref."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Every commit, so the guard can ask whether the sha is on main and
          # read the version files at it.
          fetch-depth: 0
          # The bot token when it exists, so the tag push starts release.yml on
          # its own. Otherwise the built-in token, and the dispatch job below.
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Gather ci's runs and the remote's tags
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          want="${INPUT_SHA:-origin/main}"
          if [ -n "${INPUT_SHA}" ] && ! [[ "${INPUT_SHA}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::\"${INPUT_SHA}\" is not a commit sha. Give a hex sha, or leave it empty for main's tip."
            exit 1
          fi
          if ! sha=$(git rev-parse --verify --quiet "${want}^{commit}"); then
            echo "::error::\"${want}\" is not a commit in this repository."
            exit 1
          fi
          echo "SHA=${sha}" >> "$GITHUB_ENV"
          # The same question release.yml asks before it builds, narrowed to
          # push runs: a pull_request run tests a merge that main never held.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=100" > runs.json
          # THE TESTED TWIN. A batch merged with --merge is a merge commit whose
          # tree is often byte-identical to the batch head's, which already passed
          # a push run. Gather that parent's push runs and each green run's jobs;
          # the guard decides whether the trees match and the run was whole.
          echo '{"workflow_runs":[]}' > twin-runs.json
          echo '{}' > twin-jobs.json
          if parent=$(git rev-parse --verify --quiet "${sha}^2^{commit}"); then
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${parent}&event=push&per_page=100" > twin-runs.json
            for id in $(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' twin-runs.json); do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?filter=latest&per_page=100" > "twin-jobs-${id}.json"
              jq --arg id "$id" --slurpfile j "twin-jobs-${id}.json" '. + {($id): $j[0].jobs}' twin-jobs.json > twin-jobs.next
              mv twin-jobs.next twin-jobs.json
            done
            echo "second parent ${parent}"
          fi
          git ls-remote --tags origin > tags.txt
          echo "commit ${sha}"

      - name: The guards
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/tag-release-check.mjs --version "$VERSION" --sha "$SHA" \
            --main-ref origin/main --ci-runs runs.json --remote-tags tags.txt \
            --twin-runs twin-runs.json --twin-jobs twin-jobs.json

      - name: Tag and push
        id: push
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG_SHA: ${{ steps.check.outputs.sha }}
          HAS_BOT: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          git -c user.name="village-os release train" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "village-os ${VERSION}" "$TAG_SHA"
          # Never forced: if the tag appeared since the guard looked, the
          # remote refuses this push and nothing is overwritten.
          git push origin "refs/tags/${TAG}"
          if [ "$HAS_BOT" = "true" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            how="Pushed with RELEASE_BOT_TOKEN, so release.yml starts on the tag push."
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            how="Pushed with GITHUB_TOKEN, which starts no workflow, so the next job dispatches release.yml on ${TAG}."
          fi
          echo "::notice::Tagged ${TAG} at ${TAG_SHA}. ${how}"
          { echo "### Tagged ${TAG}"; echo; echo "On ${TAG_SHA}. ${how}"; } >> "$GITHUB_STEP_SUMMARY"

  # Only when the tag went out with GITHUB_TOKEN. The only job that holds
  # actions: write, and all it does is start release.yml on the tag.
  release:
    needs: tag
    if: needs.tag.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          # Name the run it started, for whoever reads this one. The dispatch
          # answers before the run exists, so look for a short while.
          url=""
          for _ in $(seq 1 12); do
            url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
                    --event workflow_dispatch --branch "$TAG" --limit 1 \
                    --json url --jq '.[0].url // ""')
            [ -n "$url" ] && break
            sleep 5
          done
          echo "::notice::Dispatched release.yml on ${TAG}. ${url:-Its run will appear under release in the Actions tab.}"
          { echo "### release.yml dispatched on ${TAG}"; echo; echo "${url:-The run will appear under release in the Actions tab.}"; } >> "$GITHUB_STEP_SUMMARY"
