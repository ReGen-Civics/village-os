# MAIN OWNS THE GENERATED FILES (Rye, 2026-11-09).
#
# Nine files are written by generators out of the code (the list is
# GENERATED_FILES in scripts/lib/generatedDocs.mjs). A pull request used to commit
# them regenerated, so every landing on main made every open pull request
# conflict, GitHub ran no CI on the conflicted ones, and a night of re-merges
# jammed the runners. Now a pull request never commits them. This workflow runs
# every generator on each push to main and commits what changed as ONE bot commit.
# The flow, in plain words, is docs/GENERATED_DOCS.md.
#
# PORTABLE: it uses only the built-in GITHUB_TOKEN. No secret, no repository name,
# no app. It needs `contents: write` (declared below) and a main branch that lets
# github-actions push; if the repository ever protects main, see the doc.
#
# PROTECTED MAIN (the lead, 20 Nov 2026: "Make CI mandatory on main"): main carries a ruleset
# that requires the seven CI jobs, and GitHub will not let a repository ruleset exempt the
# GitHub Actions app. So when the DOCS_DEPLOY_KEY secret is set, this job checks out and
# pushes with that write-enabled deploy key, which the ruleset exempts. Without the secret
# it falls back to GITHUB_TOKEN exactly as before, so the file is safe on an unprotected
# main and in a fork.
#
# NO LOOP: a push made with GITHUB_TOKEN starts no workflow run, so the bot commit
# does not trigger ci.yml or this file again. A push made with the deploy key DOES start
# runs, so the job below skips its own commit by message, and a run over unchanged docs
# commits nothing in any case. The host deploys from the push itself,
# so the bot commit deploys. That is wanted: docs/knowledge/governance-lineage.md
# ships in the image and the assistant reads it.
#
# IF A GENERATOR FAILS the job goes red and ONE issue titled "Generated docs failed
# on main" is opened or updated, naming the generator. A bad document never goes
# out silently. Nothing is committed unless every generator ran.
#
# CHECK FIRST, PUSH SECOND (26 Nov 2026). This used to push to main and run its
# strict checks AFTER the push, and it never ran a test on what it pushed. That
# day main went red twice on this bot's commit and not on the release before it:
# 7366a88, where a test reading es.po met the folded Spanish, and a187ce0, where
# check-i18n-catalogs in strict mode met a folded plural with no `one` case. Every
# open pull request merges main into its run, so each one inherited the red.
# Now the gate below runs the strict checks and scripts/check-post-fold.mjs (the
# catalog check plus every test that reads a catalog) on the regenerated tree
# BEFORE anything reaches main. If it fails, main is left as it was (green, with
# stale docs), the tree is pushed to the branch bot/generated-docs for whoever
# fixes it, and the one issue says which check failed. The same script runs in
# ci.yml with --fold on every pull request, so this gate should never be the
# first to see a red.
name: generated-docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One at a time, newest wins: every run regenerates from the head it checked out,
# so a superseded run has nothing the next one will not do.
#
# THE BOT'S OWN COMMIT GETS ITS OWN GROUP. Pushed with the deploy key, that commit
# starts a run of this workflow, and the job skips it by message. But concurrency is
# decided before any job's `if:`, so in a shared group that skipped run still
# cancelled the run that pushed it, during its Strict check: every committing run from
# #319 to #327 (25 Nov 2026) ended "cancelled" with the strict check unfinished and no
# issue opened. In a group of its own, the skipped run cancels nothing.
concurrency:
  group: generated-docs-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Regenerate the generated docs and catalogs') && 'bot-commit' || 'regenerate' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    # Its own commit, pushed with the deploy key, starts this workflow again: skip it.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Regenerate the generated docs and catalogs')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The governance generator names the last commit that changed a source.
          fetch-depth: 0
          # The deploy key the main ruleset exempts. Empty means the built-in token.
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate
        id: gen
        # Every generator runs even when an earlier one fails, so the issue names
        # all of them. Nothing is committed unless the list of failures is empty.
        run: |
          failed=""
          run_one() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@"; then echo "ok: $name"; else echo "::error::generator failed: $name"; failed="$failed $name"; fi
            echo "::endgroup::"
          }
          run_one governance   node scripts/generate-governance-doc.mjs
          run_one economics    node scripts/generate-economics-doc.mjs
          run_one tokens       node scripts/generate-token-doc.mjs
          run_one variables    node scripts/generate-variables-doc.mjs
          run_one modules      node scripts/generate-modules-doc.mjs
          run_one capabilities node scripts/generate-capabilities-doc.mjs
          # Pull requests add translations as fragments (client/src/locales/<tag>.d/*.po).
          # Fold them into their catalogs and delete them BEFORE extract, so extract tidies the result.
          run_one fold-po      node scripts/fold-po-fragments.mjs
          run_one i18n-extract pnpm i18n:extract
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      - name: Idempotent
        # A second run over the output of the first must change nothing. A
        # generator that cannot keep that promise would commit on every merge.
        run: |
          git add -A -- docs client/src/locales
          git diff --cached > "$RUNNER_TEMP/first.diff"
          node scripts/generate-governance-doc.mjs
          node scripts/generate-economics-doc.mjs
          node scripts/generate-token-doc.mjs
          node scripts/generate-variables-doc.mjs
          node scripts/generate-modules-doc.mjs
          node scripts/generate-capabilities-doc.mjs
          node scripts/fold-po-fragments.mjs
          pnpm i18n:extract
          git add -A -- docs client/src/locales
          git diff --cached > "$RUNNER_TEMP/second.diff"
          if ! cmp -s "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"; then
            echo "::error::a second generator run changed the output again; refusing to commit"
            diff "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff" | head -60 || true
            exit 1
          fi

      - name: Main stays green on this tree
        # Every check main's own run would make on what this job is about to
        # push, run BEFORE the push. All of them run; the file names each
        # failure for the issue below. A failure here holds the push back.
        id: gate
        continue-on-error: true
        env:
          GENERATED_DOCS_MODE: strict
        run: |
          : > "$RUNNER_TEMP/gate-failed.txt"
          gate() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@"; then echo "ok: $name"; else echo "::error::held back: $name failed on the regenerated tree"; echo "$name" >> "$RUNNER_TEMP/gate-failed.txt"; fi
            echo "::endgroup::"
          }
          gate governance-doc   node scripts/check-governance-doc.mjs
          gate economics-doc    node scripts/check-economics-doc.mjs
          gate token-doc        node scripts/check-token-doc.mjs
          gate variables-doc    node scripts/check-variables-doc.mjs
          gate modules-doc      node scripts/check-modules-doc.mjs
          gate capabilities-doc node scripts/check-capabilities-doc.mjs
          # The catalogs in strict mode, and every test that reads a catalog.
          gate post-fold        node scripts/check-post-fold.mjs
          [ ! -s "$RUNNER_TEMP/gate-failed.txt" ]

      - name: Hold back, and leave the tree where it can be fixed
        # main keeps its last green commit; its docs are stale until the cause
        # is fixed. The regenerated tree goes to ONE branch, overwritten on each
        # held-back run, so a lane can check it out and see the failure.
        # bot/generated-docs is outside ci.yml's push branches, so this starts
        # no run. Then the job fails, and the step after updates the one issue.
        if: steps.gate.outcome == 'failure'
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q --allow-empty -m "Regenerate the generated docs and catalogs (held back)

          Written by .github/workflows/generated-docs.yml from main at $(git rev-parse --short HEAD).
          Not pushed to main: $(paste -sd, "$RUNNER_TEMP/gate-failed.txt") failed on this tree."
          git push --force origin HEAD:refs/heads/bot/generated-docs
          echo "::error::Held back from main: $(paste -sd, "$RUNNER_TEMP/gate-failed.txt") failed on the regenerated tree. It is on the branch bot/generated-docs."
          exit 1

      - name: Commit
        id: commit
        if: steps.gate.outcome == 'success'
        run: |
          if git diff --cached --quiet; then
            echo "Generated files already match main. No commit."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Regenerate the generated docs and catalogs

          Written by .github/workflows/generated-docs.yml from main at $(git rev-parse --short HEAD).
          Pull requests do not commit these files; see docs/GENERATED_DOCS.md."
          # If main moved while this ran, a newer run of this workflow owns the
          # regeneration. Do not force anything.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then
            echo "::notice::main moved during this run; the newer run regenerates. Nothing pushed."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:refs/heads/main

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.gen.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Generated docs failed on main"
          held="$(paste -sd, "$RUNNER_TEMP/gate-failed.txt" 2>/dev/null || true)"
          if [ -n "$FAILED" ]; then
            what="generator(s) ${FAILED}"
          elif [ -n "$held" ]; then
            what="${held}, on the regenerated tree, so it was held back from main and pushed to the branch bot/generated-docs"
          else
            what="a step after generating (see the run)"
          fi
          body="The generated-docs workflow failed on main at $(git rev-parse --short HEAD). Failed: ${what}.

          Nothing reached main, so main stays green and its docs are stale. Run: ${RUN_URL}

          Fix the generator, the catalog or the code it reads. Close this issue when a run is green."
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
